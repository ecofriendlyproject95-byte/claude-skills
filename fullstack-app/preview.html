<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Agents — App Preview</title>
<style>
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #6366f1;
    --bg: #f8f9ff;
    --surface: #ffffff;
    --border: #e8eaf0;
    --text: #1a1d2e;
    --muted: #8b90a7;
    --radius: 20px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  /* ── Phone shell ── */
  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    box-shadow:
      0 0 0 12px #1a1a2e,
      0 0 0 14px #2d2d4e,
      0 40px 80px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── Status bar ── */
  .status-bar {
    background: var(--bg);
    padding: 14px 28px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    flex-shrink: 0;
  }
  .notch {
    width: 120px;
    height: 30px;
    background: #1a1a2e;
    border-radius: 0 0 20px 20px;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* ── Screen container ── */
  .screen {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── HOME SCREEN ── */
  #home-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .home-header {
    padding: 12px 20px 0;
    background: var(--bg);
  }
  .home-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .app-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .app-title { font-size: 20px; font-weight: 800; color: var(--text); }
  .app-subtitle { font-size: 12px; color: var(--muted); }

  /* domain filter */
  .domain-filter {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    background: var(--bg);
  }
  .domain-filter::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    background: #f0f0f8;
    color: var(--muted);
    border: none;
    outline: none;
  }
  .chip.active { background: var(--primary); color: #fff; }
  .chip:hover:not(.active) { background: #e0e0f0; }

  /* agent list */
  .agent-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 24px;
    scrollbar-width: none;
  }
  .agent-list::-webkit-scrollbar { display: none; }

  .agent-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .agent-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .agent-card:active { transform: scale(0.98); }

  .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .agent-icon-box {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .agent-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .domain-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 3px;
  }
  .arrow { margin-left: auto; color: #ccc; font-size: 12px; }
  .agent-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── CHAT SCREEN ── */
  #chat-screen {
    display: none;
    flex-direction: column;
    height: 100%;
  }

  .chat-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: var(--text); padding: 4px;
  }
  .chat-agent-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .chat-agent-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .chat-agent-domain { font-size: 11px; font-weight: 600; }
  .clear-btn {
    margin-left: auto;
    background: none; border: none;
    font-size: 18px; cursor: pointer; color: var(--muted);
    padding: 4px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .messages::-webkit-scrollbar { display: none; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    gap: 12px;
    text-align: center;
  }
  .empty-icon-big {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .empty-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .suggestion-chip {
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid;
    background: transparent;
    transition: all 0.2s;
  }
  .suggestion-chip:hover { opacity: 0.8; }

  /* message bubbles */
  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
  }
  .bubble.user {
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble pre {
    background: #f3f4f8;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .bubble code { font-family: 'Courier New', monospace; }
  .bubble p { margin-bottom: 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-left: 16px; }
  .bubble li { margin-bottom: 3px; }

  /* typing indicator */
  .typing {
    display: flex; gap: 4px; padding: 12px 14px;
    background: var(--surface);
    border-radius: 18px; border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
    width: fit-content;
    max-width: 72%;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* input bar */
  .input-bar {
    padding: 12px 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  .input-wrap {
    flex: 1;
    background: #f3f4f8;
    border-radius: 24px;
    padding: 10px 16px;
    border: 1.5px solid transparent;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--primary); background: #fff; }
  textarea {
    width: 100%; border: none; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--text);
    resize: none; outline: none; max-height: 100px;
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    font-size: 18px;
    color: #fff;
  }
  .send-btn:disabled { background: #ccc !important; cursor: not-allowed; }
  .send-btn:hover:not(:disabled) { transform: scale(1.05); }

  /* ── Scrollbar on desktop ── */
  @media (min-width: 600px) {
    .phone { min-height: 750px; }
  }

  /* config overlay */
  .config-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .config-box {
    background: #fff; border-radius: 20px;
    padding: 28px; max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .config-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .config-box p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
  .config-box label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  .config-box input {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid #e0e0e0; border-radius: 10px;
    font-size: 14px; outline: none; margin-bottom: 16px;
  }
  .config-box input:focus { border-color: var(--primary); }
  .config-btn {
    width: 100%; padding: 12px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 12px; font-size: 15px;
    font-weight: 700; cursor: pointer;
  }
  .config-btn:hover { background: #4f46e5; }
  .skip-link {
    display: block; text-align: center; margin-top: 12px;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .skip-link:hover { color: var(--primary); }
</style>
</head>
<body>

<!-- Config overlay -->
<div class="config-overlay" id="config-overlay">
  <div class="config-box">
    <h2>⚙️ Backend URL</h2>
    <p>Enter the URL of your running NestJS backend. If you haven't started it yet, click "Use Demo Mode" to see the UI with sample responses.</p>
    <label>Backend URL</label>
    <input type="text" id="backend-url-input" value="http://localhost:3000" placeholder="http://localhost:3000"/>
    <button class="config-btn" onclick="connectBackend()">Connect & Load Agents</button>
    <span class="skip-link" onclick="useDemoMode()">Use Demo Mode (no backend needed)</span>
  </div>
</div>

<!-- Phone frame -->
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span>●●●</span>
      <span>WiFi</span>
      <span>🔋</span>
    </div>
  </div>

  <div class="screen">

    <!-- HOME SCREEN -->
    <div id="home-screen">
      <div class="home-header">
        <div class="home-title-row">
          <div class="app-icon">✨</div>
          <div>
            <div class="app-title">AI Agents</div>
            <div class="app-subtitle">Your expert team, on demand</div>
          </div>
        </div>
      </div>
      <div class="domain-filter" id="domain-filter"></div>
      <div class="agent-list" id="agent-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" onclick="goBack()">‹</button>
        <div class="chat-agent-icon" id="chat-icon"></div>
        <div>
          <div class="chat-agent-name" id="chat-name"></div>
          <div class="chat-agent-domain" id="chat-domain"></div>
        </div>
        <button class="clear-btn" onclick="clearChat()">🗑</button>
      </div>
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon-big" id="empty-icon"></div>
          <div class="empty-title" id="empty-title"></div>
          <div class="empty-desc" id="empty-desc"></div>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-wrap">
          <textarea id="msg-input" rows="1" placeholder="Ask anything…"
            oninput="autoResize(this)"
            onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let BASE_URL = 'http://localhost:3000';
let DEMO_MODE = false;
let agents = [];
let currentAgent = null;
let history = [];
let isSending = false;
let selectedDomain = 'All';

// ── Demo agents (fallback when no backend) ─────────────────────────────────
const DEMO_AGENTS = [
  { slug:'cs-senior-engineer', name:'Senior Engineer', domain:'Engineering', description:'Expert code reviews, architecture decisions, and technical problem-solving.', icon:'⚙️', color:'#3B82F6' },
  { slug:'cs-backend-engineer', name:'Backend Engineer', domain:'Engineering', description:'APIs, databases, microservices, performance, and backend architecture.', icon:'🔧', color:'#6366F1' },
  { slug:'cs-frontend-engineer', name:'Frontend Engineer', domain:'Engineering', description:'UI implementation, React/Flutter, performance, and accessibility.', icon:'🎨', color:'#EC4899' },
  { slug:'cs-fullstack-engineer', name:'Fullstack Engineer', domain:'Engineering', description:'End-to-end feature development from database to UI.', icon:'🚀', color:'#8B5CF6' },
  { slug:'startup-cto', name:'Startup CTO', domain:'Personas', description:'Technical co-founder perspective on build vs buy, stack choices, and team scaling.', icon:'💡', color:'#0EA5E9' },

  { slug:'growth-marketer', name:'Growth Marketer', domain:'Personas', description:'Growth loops, viral mechanics, funnel optimization, and retention.', icon:'📊', color:'#10B981' },
  { slug:'cs-project-manager', name:'Project Manager', domain:'Project Management', description:'Sprint planning, backlog grooming, delivery tracking, and stakeholder comms.', icon:'📋', color:'#14B8A6' },
  { slug:'cs-ux-researcher', name:'UX Researcher & Designer', domain:'Design', description:'User research, wireframes, design systems, and usability heuristics.', icon:'🖌️', color:'#F97316' },
  { slug:'cs-content-creator', name:'Content Creator', domain:'Marketing', description:'Blog posts, social content, email copy, and content strategy.', icon:'✍️', color:'#EF4444' },
  { slug:'cs-demand-gen-specialist', name:'Demand Gen Specialist', domain:'Marketing', description:'Paid ads, campaigns, funnels, and pipeline generation.', icon:'📈', color:'#D97706' },
  { slug:'cs-aeo', name:'AEO Specialist', domain:'Marketing', description:'Get your content cited by ChatGPT, Perplexity, Claude, and Gemini.', icon:'🤖', color:'#7C3AED' },
  { slug:'cs-ceo-advisor', name:'CEO Advisor', domain:'C-Level', description:'Strategic decisions, fundraising, board management, and company direction.', icon:'👔', color:'#1D4ED8' },
  { slug:'cs-cto-advisor', name:'CTO Advisor', domain:'C-Level', description:'Technical strategy, engineering org design, and technology roadmap.', icon:'🏗️', color:'#2563EB' },
  { slug:'cs-cmo-advisor', name:'CMO Advisor', domain:'C-Level', description:'Go-to-market strategy, brand, demand generation, and product marketing.', icon:'📣', color:'#DC2626' },
  { slug:'cs-cfo-advisor', name:'CFO Advisor', domain:'C-Level', description:'Financial modeling, runway, unit economics, and fundraising strategy.', icon:'💰', color:'#065F46' },
  { slug:'cs-product-manager', name:'Product Manager', domain:'Product', description:'Roadmap, PRDs, prioritization, user stories, and product strategy.', icon:'🗺️', color:'#059669' },
  { slug:'cs-product-strategist', name:'Product Strategist', domain:'Product', description:'Market positioning, competitive analysis, product vision, and pricing.', icon:'🎯', color:'#0D9488' },
  { slug:'cs-research', name:'Research Orchestrator', domain:'Research', description:'Market pulse, lit reviews, patents, competitive dossiers, and grants.', icon:'🔍', color:'#6B7280' },
  { slug:'cs-financial-analyst', name:'Financial Analyst', domain:'Finance', description:'Financial modeling, SaaS metrics, unit economics, and investment analysis.', icon:'📉', color:'#047857' },
];

const DEMO_RESPONSES = {
  'cs-senior-engineer': "Great question! As a senior engineer, I'd recommend starting with **clean interfaces** over clever implementations.\n\nHere's my approach:\n1. Define the contract first (types/interfaces)\n2. Write the simplest passing implementation\n3. Refactor only when complexity is justified\n\nWhat specific problem are you working on?",
  'cs-ceo-advisor': "Before we dive in — **what decision does this drive?**\n\nI find founders often ask about tactics when they actually need to make a strategic choice. Tell me:\n- What's the core trade-off you're facing?\n- What happens if you get this wrong?\n\nLet's get to the real question.",
  'cs-product-manager': "Good framing. Let me help you think through this with a **RICE score**:\n\n- **Reach**: How many users does this impact per quarter?\n- **Impact**: How much does it move your north-star metric?\n- **Confidence**: How sure are you about the impact estimate?\n- **Effort**: How many engineer-weeks?\n\nWhat feature are you trying to prioritize?",
  'default': "I'm here to help! Tell me more about what you're working on, and I'll give you my expert perspective on it.",
};

const SUGGESTIONS_MAP = {
  'cs-senior-engineer': ['Review my code architecture', 'Best practices for this feature?', 'How to refactor this?'],
  'cs-backend-engineer': ['Design a REST API for me', 'How to optimize this query?', 'Best auth strategy?'],
  'cs-frontend-engineer': ['Review my UI component', 'How to improve performance?', 'Best state management?'],
  'cs-fullstack-engineer': ['Build a feature end-to-end', 'How should I structure this?', 'Review my stack choices'],
  'startup-cto': ['Should we build or buy?', 'How do I scale my team?', 'What stack should we use?'],
  'cs-ceo-advisor': ['Help me think through strategy', 'How do I prepare for fundraising?', 'Board structure advice'],
  'cs-product-manager': ['Help me write a PRD', 'Prioritize my roadmap', 'What metrics to track?'],
  'cs-content-creator': ['Write a LinkedIn post', 'Create a content calendar', 'Improve my landing page copy'],
  'cs-research': ['Analyze my market', 'Who are my top competitors?', 'What trends to watch?'],
  'default': ['How can you help me?', 'What should I focus on first?', 'Give me your top recommendation'],
};

// ── Utilities ─────────────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Config ─────────────────────────────────────────────────────────────────
async function connectBackend() {
  const url = document.getElementById('backend-url-input').value.trim().replace(/\/$/, '');
  BASE_URL = url;
  try {
    const res = await fetch(`${BASE_URL}/agents`);
    if (!res.ok) throw new Error('Not OK');
    agents = await res.json();
    document.getElementById('config-overlay').style.display = 'none';
    renderHome();
  } catch {
    alert(`Could not connect to ${url}/agents\n\nMake sure your NestJS backend is running.\nOr click "Use Demo Mode".`);
  }
}

function useDemoMode() {
  DEMO_MODE = true;
  agents = DEMO_AGENTS;
  document.getElementById('config-overlay').style.display = 'none';
  renderHome();
}

// ── Home screen ────────────────────────────────────────────────────────────
function renderHome() {
  const domains = ['All', ...new Set(agents.map(a => a.domain))];
  const filter = document.getElementById('domain-filter');
  filter.innerHTML = domains.map(d =>
    `<button class="chip ${d===selectedDomain?'active':''}" onclick="filterDomain('${d}')">${d}</button>`
  ).join('');
  renderAgentList();
}

function filterDomain(domain) {
  selectedDomain = domain;
  renderHome();
}

function renderAgentList() {
  const list = document.getElementById('agent-list');
  const filtered = selectedDomain === 'All' ? agents : agents.filter(a => a.domain === selectedDomain);
  list.innerHTML = filtered.map(a => `
    <div class="agent-card" onclick="openAgent('${a.slug}')"
         style="border-color:${hexToRgba(a.color,0.2)}; box-shadow:0 4px 12px ${hexToRgba(a.color,0.08)}">
      <div class="card-top">
        <div class="agent-icon-box" style="background:${hexToRgba(a.color,0.12)}">${a.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="agent-name">${a.name}</div>
          <span class="domain-tag" style="background:${hexToRgba(a.color,0.1)};color:${a.color}">${a.domain}</span>
        </div>
        <span class="arrow">›</span>
      </div>
      <div class="agent-desc">${a.description}</div>
    </div>
  `).join('');
}

// ── Chat screen ─────────────────────────────────────────────────────────────
function openAgent(slug) {
  currentAgent = agents.find(a => a.slug === slug);
  history = [];

  // header
  document.getElementById('chat-icon').textContent = currentAgent.icon;
  document.getElementById('chat-icon').style.background = hexToRgba(currentAgent.color, 0.12);
  document.getElementById('chat-name').textContent = currentAgent.name;
  document.getElementById('chat-domain').textContent = currentAgent.domain;
  document.getElementById('chat-domain').style.color = currentAgent.color;

  // send button color
  document.getElementById('send-btn').style.background = currentAgent.color;

  // empty state
  document.getElementById('empty-icon').textContent = currentAgent.icon;
  document.getElementById('empty-icon').style.background = hexToRgba(currentAgent.color, 0.1);
  document.getElementById('empty-title').textContent = `Chat with ${currentAgent.name}`;
  document.getElementById('empty-desc').textContent = currentAgent.description;

  // suggestions
  const suggs = SUGGESTIONS_MAP[currentAgent.slug] || SUGGESTIONS_MAP.default;
  document.getElementById('suggestions').innerHTML = suggs.map(s =>
    `<button class="suggestion-chip"
       style="border-color:${hexToRgba(currentAgent.color,0.3)};color:${currentAgent.color};background:${hexToRgba(currentAgent.color,0.06)}"
       onclick="useSuggestion('${s.replace(/'/g,"\\'")}')">
      ${s}
    </button>`
  ).join('');

  // placeholder
  document.getElementById('msg-input').placeholder = `Ask ${currentAgent.name} anything…`;

  // show messages container with empty state visible
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  msgs.appendChild(document.getElementById('empty-state'));
  document.getElementById('empty-state').style.display = 'flex';

  // switch screens
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
}

function goBack() {
  document.getElementById('home-screen').style.display = 'flex';
  document.getElementById('chat-screen').style.display = 'none';
  currentAgent = null;
  history = [];
}

function clearChat() {
  if (!confirm('Clear this conversation?')) return;
  history = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  msgs.appendChild(document.getElementById('empty-state'));
  document.getElementById('empty-state').style.display = 'flex';
}

function useSuggestion(text) {
  document.getElementById('msg-input').value = text;
  sendMessage();
}

function appendMessage(role, content) {
  const emptyState = document.getElementById('empty-state');
  emptyState.style.display = 'none';

  const msgs = document.getElementById('messages');
  const isUser = role === 'user';
  const color = currentAgent?.color || '#6366f1';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  row.dataset.role = role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.style.background = isUser ? hexToRgba(color, 0.15) : hexToRgba(color, 0.1);
  avatar.style.color = color;
  avatar.textContent = isUser ? 'You' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  if (isUser) {
    bubble.style.background = color;
    bubble.textContent = content;
  } else {
    bubble.innerHTML = simpleMarkdown(content);
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'typing-row';

  const color = currentAgent?.color || '#6366f1';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.style.background = hexToRgba(color, 0.1);
  avatar.style.color = color;
  avatar.textContent = 'AI';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(avatar);
  row.appendChild(typing);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

// ── Send message ────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isSending) return;

  isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  appendMessage('user', text);
  history.push({ role: 'user', content: text });

  if (DEMO_MODE) {
    const typingRow = appendTyping();
    await new Promise(r => setTimeout(r, 800));
    typingRow.remove();
    const reply = DEMO_RESPONSES[currentAgent.slug] || DEMO_RESPONSES.default;
    const bubble = appendMessage('assistant', reply);
    history.push({ role: 'assistant', content: reply });
    isSending = false;
    document.getElementById('send-btn').disabled = false;
    return;
  }

  const typingRow = appendTyping();

  try {
    const response = await fetch(`${BASE_URL}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        agentSlug: currentAgent.slug,
        message: text,
        history: history.slice(0, -1),
      }),
    });

    typingRow.remove();
    const bubble = appendMessage('assistant', '');
    const msgs = document.getElementById('messages');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            if (parsed.text) {
              fullText += parsed.text;
              bubble.innerHTML = simpleMarkdown(fullText);
              msgs.scrollTop = msgs.scrollHeight;
            }
          } catch {}
        }
      }
    }

    history.push({ role: 'assistant', content: fullText });
  } catch (e) {
    typingRow.remove();
    appendMessage('assistant', `❌ Error: ${e.message}\n\nMake sure the NestJS backend is running.`);
  } finally {
    isSending = false;
    document.getElementById('send-btn').disabled = false;
  }
}

// ── Simple Markdown renderer ─────────────────────────────────────────────
function simpleMarkdown(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code style="background:#f3f4f8;padding:1px 5px;border-radius:4px;font-size:12px">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<h3 style="font-size:14px;font-weight:700;margin:10px 0 4px">$1</h3>')
    .replace(/^## (.+)$/gm, '<h2 style="font-size:15px;font-weight:800;margin:10px 0 5px">$1</h2>')
    .replace(/^# (.+)$/gm, '<h1 style="font-size:17px;font-weight:800;margin:12px 0 6px">$1</h1>')
    .replace(/^\- (.+)$/gm, '<li style="margin-left:14px;margin-bottom:4px">$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li style="margin-left:14px;margin-bottom:4px">$1. $2</li>')
    .replace(/\n\n/g, '</p><p style="margin-bottom:6px">')
    .replace(/\n/g, '<br>')
    .replace(/^(?!<[a-z])(.+)$/gm, '<p style="margin-bottom:6px">$1</p>');
}
